<script src="../fernet.txt"></script>

    <script type="module">
        const SALT = "my-fixed-salt-2026";
        const ITERATIONS = 600000;

        let encryptedMsg =
            "gAAAAABqs0G7zdpt-VXK3T3rostZr14xz569fcgDae41Q-n31n0JBSwuwa0v_7GvZpjhbpDXTwX43MWy5StP7j_2uQFiaS2kXg==";

        async function deriveFernetKey(password) {
            const encoder = new TextEncoder();

            const importedKey = await crypto.subtle.importKey(
                "raw",
                encoder.encode(password),
                "PBKDF2",
                false,
                ["deriveBits"]
            );

            const derivedBits = await crypto.subtle.deriveBits(
                {
                    name: "PBKDF2",
                    salt: encoder.encode(SALT),
                    iterations: ITERATIONS,
                    hash: "SHA-256"
                },
                importedKey,
                256
            );

            const bytes = new Uint8Array(derivedBits);

            let binary = "";

            for (let i = 0; i < bytes.length; i++) {
                binary += String.fromCharCode(bytes[i]);
            }

            return btoa(binary)
                .replace(/\+/g, "-")
                .replace(/\//g, "_");
        }

        async function decryptMessage(encryptedMsg, password) {
            try {
                const key = await deriveFernetKey(password);

                const secret = new fernet.Secret(key);

                const token = new fernet.Token({
                    secret: secret,
                    token: encryptedMsg,
                    ttl: 0
                });

                return token.decode();

            } catch (error) {
                return null;
            }
        }

        window.decryptMessage = decryptMessage;

        let savedToken = localStorage.getItem("token");

        if (savedToken !== null) {
            console.log("redirecting...")
            let decrypted_msg = await decryptMessage(encryptedMsg, savedToken);

            if (decrypted_msg !== "PHWLK") {
                window.location.href = "../index.html";

            }
            else{
                document.body.style.display = "block"
            }
        }

    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Games</title>

</head>
<body>
    <div id="TopNav">
        <button class="TopNav-button" onclick="window.location.href='offline_games.html';"> Offline Games </button>
        <button class="TopNav-button" onclick="window.location.href='tools.html';"> Other Games </button>
    </div>

    <h1>Offline Games</h1>

    <div id="ToolList"></div>

    <h1></h1>
    <script>

        const tools = [
            "html-viewer.html"
        ]


        const toolList = document.getElementById("ToolList");

        tools.forEach(function(gameFile) {

            // Create a button
            const button = document.createElement("button");
            button.id = "OfflineToolButton";
            // Turn the filename into the button's name
            let gameName = gameFile;

            // Remove .html
            gameName = gameName.replace(/\.html$/i, "");

            // Replace - and _ with spaces
            gameName = gameName.replace(/[-_]/g, " ");

            // Capitalize the first letter of each word
            gameName = gameName.replace(/\b\w/g, function(letter) {
                return letter.toUpperCase();
            });

            // Set the button text
            button.textContent = gameName;

            // When the button is clicked,
            // open the game from the offline folder
            button.onclick = async function() {
                let password_token = localStorage.getItem('token')
                let decrypted_password = await window.decryptMessage('gAAAAABqs0G7zdpt-VXK3T3rostZr14xz569fcgDae41Q-n31n0JBSwuwa0v_7GvZpjhbpDXTwX43MWy5StP7j_2uQFiaS2kXg==',password_token)
                if (decrypted_password !== "PHWLK"){
                    window.location.href = "index.html"
                }

                window.location.href = "../tools/" + gameFile
                
            };

            // Add the button to the page
            toolList.appendChild(button);

            // Put a space after each button
            toolList.appendChild(document.createTextNode(" "));
        });

        function LoadStash() {
            window.location.href = "game_stash.html";
        }
    </script>

</body>
</html>
