    <script type="module">
        const SALT = "my-fixed-salt-2026";
        const ITERATIONS = 600000;

        let encryptedMsg =
            "gAAAAABqs0G7zdpt-VXK3T3rostZr14xz569fcgDae41Q-n31n0JBSwuwa0v_7GvZpjhbpDXTwX43MWy5StP7j_2uQFiaS2kXg==";

        async function deriveFernetKey(password) {
            const encoder = new TextEncoder();

            const importedKey = await crypto.subtle.importKey(
                "raw",
                encoder.encode(password),
                "PBKDF2",
                false,
                ["deriveBits"]
            );

            const derivedBits = await crypto.subtle.deriveBits(
                {
                    name: "PBKDF2",
                    salt: encoder.encode(SALT),
                    iterations: ITERATIONS,
                    hash: "SHA-256"
                },
                importedKey,
                256
            );

            const bytes = new Uint8Array(derivedBits);

            let binary = "";

            for (let i = 0; i < bytes.length; i++) {
                binary += String.fromCharCode(bytes[i]);
            }

            return btoa(binary)
                .replace(/\+/g, "-")
                .replace(/\//g, "_");
        }

        async function decryptMessage(encryptedMsg, password) {
            try {
                const key = await deriveFernetKey(password);

                const secret = new fernet.Secret(key);

                const token = new fernet.Token({
                    secret: secret,
                    token: encryptedMsg,
                    ttl: 0
                });

                return token.decode();

            } catch (error) {
                return null;
            }
        }

        window.decryptMessage = decryptMessage;

        let savedToken = localStorage.getItem("token");

        if (savedToken !== null) {
            let decrypted_msg = await decryptMessage(encryptedMsg, savedToken);

            if (decrypted_msg !== "PHWLK") {
                window.location.href = "index.html";

            }
            else{
                document.body.style.display = "block"
            }
        }

    </script>

        const gameList = document.getElementById("GameList");

        games.forEach(function(gameFile) {

            // Create a button
            const button = document.createElement("button");
            button.id = "OfflineGameButton";
            // Turn the filename into the button's name
            let gameName = gameFile;

            // Remove .html
            gameName = gameName.replace(/\.html$/i, "");

            // Replace - and _ with spaces
            gameName = gameName.replace(/[-_]/g, " ");

            // Capitalize the first letter of each word
            gameName = gameName.replace(/\b\w/g, function(letter) {
                return letter.toUpperCase();
            });

            // Set the button text
            button.textContent = gameName;

            if (gameName == "Cc.Htm"){
                button.textContent = "cookie-clicker"
            } 
            if (gameName == "Cc Working"){
                button.textContent = "cookie-clicker Working Version"
            }

            // When the button is clicked,
            // open the game from the offline folder
            button.onclick = async function() {
                let password_token = localStorage.getItem('token')
                let decrypted_password = await window.decryptMessage('gAAAAABqs0G7zdpt-VXK3T3rostZr14xz569fcgDae41Q-n31n0JBSwuwa0v_7GvZpjhbpDXTwX43MWy5StP7j_2uQFiaS2kXg==',password_token)
                if (decrypted_password !== "PHWLK"){
                    window.location.href = "index.html"
                }

                    window.location.href = "offline/" + gameFile + "/index.html"
                    return

                window.location.href = "offline/" + gameFile
                
            };
